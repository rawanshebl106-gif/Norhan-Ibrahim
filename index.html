<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتحليل نتائج الطلاب | نورهان ابراهيم</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    
    <!-- كود الـ CSS (التنسيق الخارجي والمظهر) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f7f8fa;
            color: #1f2937;
            padding: 35px 15px;
        }

        .container {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary { background-color: #1e3a8a; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }

        .btn-danger { background-color: #dc2626; color: white; }
        .btn-danger:hover { background-color: #b91c1c; }

        .output-card {
            border-top: 3px solid #3b82f6;
            padding-top: 20px;
            margin-top: 20px;
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            text-align: right;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f1f5f9;
            color: #1e3a8a;
        }

        tr:hover { background-color: #f8fafc; }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-success { background-color: #dcfce7; color: #166534; }
        .badge-warning { background-color: #fef9c3; color: #854d0e; }

        .stats-box {
            background-color: #eff6ff;
            border-right: 5px solid #1e3a8a;
            padding: 15px;
            border-radius: 6px;
            color: #1e3a8a;
            font-weight: bold;
            font-size: 16px;
        }

        .hidden { display: none; }

        .top-right-icon {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card-container">
            <!-- ايقونه الشعار -->
            <img src="assets/logo.png" class="top-right-icon" alt="شعار النظام">
            <h1>🎓 نظام إدارة وتحليل نتائج الطلاب</h1>
            <p class="subtitle">إعداد الطالبة: <strong>نورهان ابراهيم احمد ابراهيم علي</strong> | مشروع يدمج HTML, CSS, JavaScript (افتحي الـ Console لرؤية التقارير البرمجية بالضغط علي ctrl+shift+i)</p>

            <!-- أزرار التحكم -->
            <div class="control-panel">
                <button onclick="displayGeneralReport()" class="btn btn-primary">عرض التقرير العام للطلاب</button>
                <button onclick="applyGracePeriod()" class="btn btn-danger">تطبيق لجنة الرأفة</button>
            </div>

            <!-- قسم عرض النتائج -->
            <div id="output-section" class="output-card hidden">
                <h2 id="table-title">نتائج المعالجة:</h2>
                <div class="table-responsive">
                    <table id="results-table">
                        <thead>
                            <!-- هيعبئ العناوين تلقائياً عبر الجافا سكريبت -->
                        </thead>
                        <tbody id="table-body">
                            <!-- سيتم تعبئة البيانات هنا تلقائياً -->
                        </tbody>
                    </table>
                </div>
                
                <!-- صندوق الإحصائيات الخاصة بالرأفة -->
                <div id="stats-box" class="stats-box hidden">
                    <!-- سيظهر هنا المتوسط العام بعد التعديل -->
                </div>
            </div>
        </div>
    </div>

    <!-- كود الـ JavaScript (المنطق البرمجي وبيانات الطلاب) -->
    <script>
        class Student {
            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }

            calculateAverage() {
                const total = this.grades.reduce((sum, currentGrade) => sum + currentGrade, 0);
                return total / this.grades.length;
            }

            getGradeLetter(average) {
                if (average >= 90) return 'A';
                if (average >= 80) return 'B';
                if (average >= 70) return 'C';
                if (average >= 60) return 'D';
                if (average >= 50) return 'E';
                return 'F';
            }

            getFinalStatus() {
                const average = this.calculateAverage();
                if (average >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }

        const studentsList = [
            new Student(101, "مريم عبد الحسيب", [95, 88, 93], 98),
            new Student(102, "شهد محمد", [41, 46, 44], 85),
            new Student(103, "أحمد محمود", [43, 44, 48], 68),
            new Student(104, "نور الدين علي", [62, 58, 70], 80)
        ];

        function displayGeneralReport() {
            console.clear();
            console.log("📑 ---- تقرير الطلاب العام ----");
            studentsList.forEach(student => {
                const avg = student.calculateAverage();
                console.log(`الاسم: ${student.name} | المتوسط: ${avg.toFixed(1)} | التقدير: ${student.getGradeLetter(avg)} | النتيجة: ${student.getFinalStatus()}`);
            });

            document.getElementById('output-section').classList.remove('hidden');
            document.getElementById('stats-box').classList.add('hidden');
            document.getElementById('table-title').innerText = "📑 تقرير الطلاب العام:";
            
            const tableBody = document.getElementById('table-body');
            
            document.querySelector('#results-table thead').innerHTML = `
                <tr>
                    <th>رقم الجلوس (ID)</th>
                    <th>الاسم</th>
                    <th>المتوسط</th>
                    <th>التقدير</th>
                    <th>نسبة الحضور</th>
                    <th>النتيجة النهائية</th>
                </tr>
            `;

            tableBody.innerHTML = "";
            studentsList.forEach(student => {
                const avg = student.calculateAverage();
                const statusClass = student.getFinalStatus() === "ناجح" ? "badge-success" : "badge-warning";
                
                tableBody.innerHTML += `
                    <tr>
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${avg.toFixed(1)}</td>
                        <td>${student.getGradeLetter(avg)}</td>
                        <td>${student.attendance}%</td>
                        <td><span class="badge ${statusClass}">${student.getFinalStatus()}</span></td>
                    </tr>
                `;
            });
        }

        function applyGracePeriod() {
            const strugglingStudents = studentsList.filter(student => {
                const avg = student.calculateAverage();
                return avg >= 40 && avg <= 49;
            });

            const upgradedAverages = strugglingStudents.map(student => {
                return student.calculateAverage() + 5;
            });

            const totalUpgradedAverages = upgradedAverages.reduce((sum, currentAvg) => sum + currentAvg, 0);
            const strugglingCount = upgradedAverages.length;
            const generalStrugglingAverage = strugglingCount > 0 ? (totalUpgradedAverages / strugglingCount) : 0;

            console.clear();
            console.log(" ---- الطلاب المتعثرون المشمولون بالرأفة ----");
            console.log(strugglingStudents);
            console.log("\n📈 ---- درجات الرأفة الجديدة ----");
            console.log("المتوسطات بعد إضافة 5 درجات:", upgradedAverages);
            console.log(`المتوسط العام للطلاب المتعثرين بعد التعديل: ${generalStrugglingAverage.toFixed(1)}`);

            document.getElementById('output-section').classList.remove('hidden');
            document.getElementById('table-title').innerText = " تقرير لجنة الرأفة (المتوسطات بعد التعديل):";
            
            document.querySelector('#results-table thead').innerHTML = `
                <tr>
                    <th>الاسم</th>
                    <th>المتوسط الأصلي</th>
                    <th>المتوسط بعد الرأفة (+5)</th>
                </tr>
            `;

            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = "";
            
            strugglingStudents.forEach((student, index) => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${student.name}</td>
                        <td>${student.calculateAverage().toFixed(1)}</td>
                        <td style="color: #dc2626; font-weight: bold;">${upgradedAverages[index].toFixed(1)}</td>
                    </tr>
                `;
            });

            const statsBox = document.getElementById('stats-box');
            statsBox.classList.remove('hidden');
            statsBox.innerHTML = `📈 المتوسط العام للطلاب المتعثرين بعد إضافة درجات الرأفة: ${generalStrugglingAverage.toFixed(1)}`;
        }
    </script>
</body>
</html>
